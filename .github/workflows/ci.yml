name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install \
            -r requirements.txt \
            -r web_requirements.txt \
            -r requirements-dev.txt \
            httpx
          python -m pip check

      - name: Run tests
        run: python -m pytest -v tests

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --progress=plain -t confllm-test:latest .

      - name: Check image dependencies
        run: |
          docker run --rm \
            --entrypoint python \
            confllm-test:latest \
            -m pip check

      - name: Run container
        run: |
          docker run -d \
            --name confllm-test \
            -p 127.0.0.1:8000:8000 \
            -e LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e LLM_API_KEY=ci-placeholder-not-a-secret \
            -e LLM_MODEL=ci-placeholder \
            -e PARAKEET_URL=http://127.0.0.1:9 \
            -e NEMOTRON_URL=http://127.0.0.1:9 \
            confllm-test:latest

      - name: Wait for health check
        shell: bash
        run: |
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' confllm-test)" != "true" ]; then
              echo "Container stopped before becoming ready"
              exit 1
            fi

            if curl --fail --silent --show-error \
              --max-time 3 \
              http://127.0.0.1:8000/api/health; then
              echo
              echo "Health check passed"
              exit 0
            fi

            echo "Attempt $i failed, waiting..."
            sleep 2
          done

          echo "Health check failed after 30 attempts"
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs confllm-test 2>&1 || true

      - name: Cleanup
        if: always()
        run: docker rm -f confllm-test || true
