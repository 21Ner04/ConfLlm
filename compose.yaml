services:
  app:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./web_jobs:/app/web_jobs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
